<style>
  .subscribe {
    background-color:rgb(199, 0, 0);
    color:white;
    border:none;
    height:40px;
    width: 120px;
    border-radius: 5px;
    cursor:pointer;
    margin-right:10px;
    transition:opacity 0.15s;
  }

  .subscribe:hover {
    opacity: 0.6;

  }

  .subscribe:active {
    opacity: 0.4;
    
  }

  .join {
    background-color:white;
    border-color:rgb(41, 118, 211);
    border-style:solid;
    border-width:1px;
    color:rgb(41, 118, 211);
    height:40px;
    width:70px;
    border-radius:2px;
    cursor:pointer;
    margin-right:10px;
    transition:background-color 0.2s,
    color 0.2s;
  }

  .join:hover {
    background-color:rgb(41, 118, 211);
    color:white;
  }
  .join:active {
    opacity:0.7;
  }
  .tweet {
    background-color:rgb(45, 140, 191);
    color:white;
    height: 40px;
    width: 75px;
    border-radius: 20px;
    cursor:pointer;
    border:none;
    font-weight:bold;
    font-size:15px;
    transition:box-shadow 0.2s;
  }

  .tweet:hover {
    box-shadow: 5px 5px 8px rgba(0,0,0,0.3);
  }
</style>

<button class="subscribe">
    SUBSCRIBE
</button>
<button class="join">
    JOIN
</button>
<button class="tweet">
Tweet
</button>
